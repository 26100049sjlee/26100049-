<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 학점 계산기</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        input[type="text"] { flex: 2; }
        input[type="number"] { flex: 1; }
        select { flex: 1; }
        button.add-btn {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
            transition: background 0.3s;
        }
        button.add-btn:hover { background-color: #2980b9; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        th { background-color: #f8f9fa; font-weight: 600; }
        button.delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        button.delete-btn:hover { background-color: #c0392b; }
        
        .result-box {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }
        .gpa-highlight {
            font-size: 28px;
            font-weight: bold;
            color: #f1c40f;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎓 스마트 학점 계산기</h1>

    <div class="input-group">
        <input type="text" id="subName" placeholder="과목명 입력 (예: 파이썬)">
        <input type="number" id="subCredit" placeholder="학점" min="1" max="6">
        <select id="subGrade">
            <option value="A+">A+</option>
            <option value="A0">A0</option>
            <option value="B+">B+</option>
            <option value="B0">B0</option>
            <option value="C+">C+</option>
            <option value="C0">C0</option>
            <option value="D+">D+</option>
            <option value="D0">D0</option>
            <option value="F">F</option>
        </select>
        <button class="add-btn" onclick="addSubject()">추가</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>과목명</th>
                <th>학점</th>
                <th>성적</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="subjectList">
        </tbody>
    </table>

    <div class="result-box">
        총 이수 학점: <span id="totalCredits">0</span>학점
        <span class="gpa-highlight">나의 평균 학점(GPA): <span id="finalGPA">0.00</span> / 4.5</span>
    </div>
</div>

<script>
    let subjects = [];

    function getGradePoint(grade) {
        const gradeMap = {
            'A+': 4.5, 'A0': 4.0, 'B+': 3.5, 'B0': 3.0,
            'C+': 2.5, 'C0': 2.0, 'D+': 1.5, 'D0': 1.0, 'F': 0.0
        };
        return gradeMap[grade] || 0;
    }

    function addSubject() {
        const nameInput = document.getElementById('subName').value;
        const creditInput = parseInt(document.getElementById('subCredit').value);
        const gradeInput = document.getElementById('subGrade').value;

        if (nameInput === '' || isNaN(creditInput)) {
            alert('과목명과 학점을 정확히 입력해주세요!');
            return;
        }

        subjects.push({ name: nameInput, credit: creditInput, grade: gradeInput });
        
        document.getElementById('subName').value = '';
        document.getElementById('subCredit').value = '';

        updateUI();
    }

    function deleteSubject(index) {
        subjects.splice(index, 1);
        updateUI();
    }

    function updateUI() {
        const tbody = document.getElementById('subjectList');
        tbody.innerHTML = '';

        let totalCredits = 0;
        let totalPoints = 0;

        for (let i = 0; i < subjects.length; i++) {
            const sub = subjects[i];
            totalCredits += sub.credit;
            totalPoints += (sub.credit * getGradePoint(sub.grade));

            const row = `<tr>
                <td>${sub.name}</td>
                <td>${sub.credit}</td>
                <td>${sub.grade}</td>
                <td><button class="delete-btn" onclick="deleteSubject(${i})">삭제</button></td>
            </tr>`;
            tbody.innerHTML += row;
        }

        const gpa = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : "0.00";
        document.getElementById('totalCredits').innerText = totalCredits;
        document.getElementById('finalGPA').innerText = gpa;
    }
</script>

</body>
</html>
